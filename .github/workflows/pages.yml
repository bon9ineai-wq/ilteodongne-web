name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - name: Build site
        working-directory: web
        env:
          SITE_URL: https://bon9ineai-wq.github.io/ilteodongne-web
        run: python build_blog.py
      - name: Apply VWorld key
        working-directory: web
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: python3 apply_vworld_key.py
      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp web/index.html web/app.css web/app.js web/places.js web/vworld-config.js web/blog.css web/robots.txt web/swipe-nav.js _site/
          mkdir -p _site/blog _site/place _site/data
          cp -a web/blog/. _site/blog/
          cp web/place/index.html web/place/place.js _site/place/
          mkdir -p _site/jobs && cp web/jobs/index.html _site/jobs/
          mkdir -p _site/compare && cp web/compare/index.html _site/compare/
          mkdir -p _site/map && cp web/map/index.html _site/map/
          mkdir -p _site/loan-calculator && cp web/loan-calculator/index.html web/loan-calculator/manifest.webmanifest web/loan-calculator/sw.js web/loan-calculator/icon-192.png web/loan-calculator/icon-512.png _site/loan-calculator/
          cp web/data/*.json _site/data/
          rm -f _site/sitemap.xml
          if grep -q 'Sitemap:' _site/robots.txt; then
            echo "robots.txt must not advertise a sitemap" >&2
            exit 1
          fi
          grep -q 'User-agent: \*' _site/robots.txt
          grep -q 'Disallow: /' _site/robots.txt
          find _site -name '*.html' -print0 | while IFS= read -r -d '' page; do
            grep -q '<meta name="robots" content="noindex, nofollow">' "$page" || {
              echo "missing noindex meta: $page" >&2
              exit 1
            }
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
