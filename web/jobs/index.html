<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일터동네 – 직종별 업체 목록</title>
<meta name="description" content="직종을 고르면 천안·아산·평택의 관련 업체와 업체가 모인 동네를 함께 보여드립니다. 국민연금 가입 사업장 데이터 기반.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--o:#E0531F;--ol:#FDEFE9;--ink:#1f1f1f;--g:#6b6b6b;--line:#e4e4e4}
*{box-sizing:border-box}i{font-style:normal}body{margin:0;font-family:Pretendard,system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:inherit;text-decoration:none}
header{height:56px;display:flex;align-items:center;padding:0 34px 0 30px;border-bottom:1px solid #eee;background:#fff}
.logo{font-size:21px;font-weight:800;letter-spacing:-.5px;width:148px}.logo b{color:var(--o);font-weight:800}
nav{display:flex;height:100%}nav a{display:flex;align-items:center;height:100%;font-size:16px;color:#666;margin-right:58px;border-bottom:3px solid transparent;padding-top:3px}
nav a.on{color:var(--ink);font-weight:700;border-color:var(--o)}
.app{margin-left:auto;background:var(--o);color:#fff;font-weight:700;font-size:14px;height:33px;padding:0 30px;border-radius:17px;display:flex;align-items:center}
.wrap{padding:0 28px 40px}
.crumb{margin:14px 0 0;font-size:14px;color:#777}
.th{display:flex;align-items:center;gap:30px;margin-top:8px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.6px}
.ex{font-size:14px;font-weight:700;color:var(--o);border:1px solid var(--o);background:var(--ol);border-radius:14px;padding:4px 14px}
.desc{margin:12px 0 0;font-size:15px;color:var(--g)}.desc button{border:0;background:none;font:inherit;color:var(--o);font-weight:700;cursor:pointer;padding:0}
.basis{display:none;margin-top:8px;font-size:14px;color:#555;background:#f6f6f6;border-radius:8px;padding:10px 14px;line-height:1.6}.basis.on{display:block}
.grid{display:grid;grid-template-columns:215px 1fr 239px;gap:22px;margin-top:24px;align-items:start}
.side{background:#f3f3f3;border-radius:8px;padding:20px 18px 24px;position:sticky;top:12px}
.side h3{margin:0 0 12px;font-size:16px;font-weight:800}.side h3+*{}.side .sec{margin-bottom:22px}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 12px;cursor:pointer}
.ck input{appearance:none;width:18px;height:18px;border:1.5px solid #aaa;border-radius:3px;background:#fff;margin:0;cursor:pointer}
.ck input:checked{background:var(--o);border-color:var(--o)}
.ck small{color:#999;margin-left:auto;font-size:13px}
.pill{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;width:100%;height:34px;border:0;border-radius:17px;background:#e6e6e6;color:#444;font:inherit;font-size:14px;margin-bottom:8px;cursor:pointer}
.pill.on{background:var(--o);color:#fff;font-weight:700}
.list{display:flex;flex-direction:column;gap:14px}
.co{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-height:88px;cursor:pointer;position:relative;background:#fff}
.co.sel{border:2px solid var(--o);padding:15px 17px}
.co .lt{width:54px;height:54px;flex:none;border-radius:7px;background:#ededed;color:#888;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.co b{display:block;font-size:16px;font-weight:800;padding-right:80px}.co small{display:block;margin-top:10px;font-size:14px;color:var(--g)}
.co .hire{position:absolute;right:16px;top:14px;font-size:13px;font-weight:800;color:var(--o)}
.more{height:44px;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit;font-size:15px;cursor:pointer}
.empty{padding:40px;text-align:center;color:#777;border:1px dashed #ccc;border-radius:8px}
.mapcol h3{margin:0 0 12px;font-size:16px;font-weight:800}
.mute{filter:grayscale(.85) brightness(1.08) contrast(.85)}#map{height:296px;border-radius:6px;background:#eee;z-index:0}
.bub{border-radius:50%;background:var(--o);color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:.95}
.bub.off{background:#bbb}
.cmp{display:flex;align-items:center;justify-content:center;height:48px;margin-top:14px;border-radius:6px;background:var(--o);color:#fff;font-weight:800;font-size:15px}
.src{margin-top:10px;font-size:12px;color:#888;line-height:1.5}
</style></head><body>
<header><a class="logo" href="/ilteodongne-web/">일터<b>동네</b></a><nav><a class="on" href="/ilteodongne-web/jobs/">직장 찾기</a><a href="#" aria-disabled="true">동네 비교</a><a href="#" aria-disabled="true">집·인프라</a><a href="/ilteodongne-web/blog/">동네 이야기</a></nav><a class="app" href="#" aria-disabled="true">앱 다운로드</a></header>
<main class="wrap">
<p class="crumb"><a href="/ilteodongne-web/">홈</a> › 직종 › <span id="cj"></span></p>
<div class="th"><h1 id="title">관련 업체 불러오는 중…</h1></div>
<p class="desc" id="desc">&nbsp;</p>
<div class="basis" id="basis"></div>
<div class="grid">
<aside class="side">
 <div class="sec"><h3>지역</h3><div id="cities"></div></div>
 <div class="sec"><h3>사업장 규모</h3><div id="sizes"></div></div>
 <div class="sec" style="margin:0"><h3>업종</h3><div id="inds"></div></div>
</aside>
<section><div class="list" id="list"></div></section>
<aside class="mapcol"><h3>지역별 업체 수</h3><div id="map"></div>
<a class="cmp" id="cmp" href="#" aria-disabled="true">이 동네들 비교하기 →</a>
<p class="src">출처: 국민연금 가입 사업장(2026) · 골프장 제외 · 위치는 주소 기반 추정</p></aside>
</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const U='https://zurfdfqfztydhbmjwyqx.supabase.co',K='sb_publishable_8asTfEEJyyDniSAITehVqg_fNAf1Oh7';
const CATS=['제조/생산','건설/공사','물류/운송','의료/요양/복지','IT/연구/기술','도소매/유통','시설관리/환경','사무/전문서비스','음식/숙박','교육','기타'];
const JOBMAP=[[/생산|품질|설비|조립|용접|가공|도장|검사|오퍼|기계/,'제조/생산'],[/물류|지게차|운송|배송|택배|운전|창고/,'물류/운송'],[/사무|경리|회계|총무|인사/,'사무/전문서비스'],[/건설|공사|현장|목수|전기공/,'건설/공사'],[/요양|간호|의료|복지|간병/,'의료/요양/복지'],[/개발|연구|IT|엔지니어|설계/,'IT/연구/기술'],[/판매|매장|유통|영업/,'도소매/유통'],[/시설|경비|미화|환경|청소/,'시설관리/환경'],[/조리|주방|서빙|호텔|숙박/,'음식/숙박'],[/교사|강사|교육/,'교육']];
const CITIES=['평택시','천안시','아산시'];
const CENTER={'평택시':[36.99,127.09],'천안시':[36.82,127.16],'아산시':[36.80,127.0]};
const SIZES=[['50 인 미만',0,49],['50~299 인',50,299],['300 인 이상',300,1e9]];
const qs=new URLSearchParams(location.search);
const job=(qs.get('job')||'생산직').trim();
const cat=CATS.includes(qs.get('c'))?qs.get('c'):((JOBMAP.find(([r])=>r.test(job))||[0,CATS.find(c=>c.split('/').some(w=>job.includes(w)))||'제조/생산'])[1]);
const reg=(qs.get('region')||qs.get('city')||'').replace(/\s/g,'');
let st={cities:new Set(CITIES.filter(c=>reg&&(c.includes(reg)||reg.includes(c.slice(0,2))))),size:qs.get('size')||'',ind:'',shown:20,sel:null};
let rows=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortInd=s=>String(s||'').replace(/\s*제조업$/,'').replace(/\s*(도매업|소매업|서비스업|운송업)$/,'')||'기타';
const dong=p=>{const a=String(p.address||'').split(/\s+/);const i=a.findIndex(t=>t===p.city);let d=a[i+1]||'';if(/구$/.test(d)&&/[읍면동]$/.test(a[i+2]||''))d=a[i+2];return /[읍면동구]$/.test(d)?d:''};
const cleanName=s=>String(s||'').replace(/주식회사|\(주\)|㈜|\(유\)|유한회사/g,'').trim();
$('cj').textContent=job;
async function fetchAll(){const out=[],seen=new Set();for(let off=0;off<5000;off+=1000){const r=await fetch(`${U}/rest/v1/rpc/search_places?offset=${off}&limit=1000`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_category:cat,p_city:null,p_limit:5000})});const d=await r.json();if(!Array.isArray(d)||!d.length)break;let n=0;for(const p of d){if(!p||seen.has(p.pid))continue;seen.add(p.pid);out.push(p);n++}if(!n||d.length<1000)break}return out}
function inSize(p){if(!st.size)return true;const s=SIZES.find(x=>x[0]===st.size);return s&&p.headcount>=s[1]&&p.headcount<=s[2]}
function base(){return rows.filter(p=>(!st.cities.size||st.cities.has(p.city))&&inSize(p))}
function filtered(){return base().filter(p=>!st.ind||shortInd(p.industry)===st.ind)}
function renderSide(){
 $('cities').innerHTML=CITIES.map(c=>`<label class="ck"><input type="checkbox" value="${c}" ${st.cities.has(c)?'checked':''}>${c}<small>${rows.filter(p=>p.city===c).length}</small></label>`).join('');
 $('cities').querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?st.cities.add(i.value):st.cities.delete(i.value);st.shown=20;render()});
 $('sizes').innerHTML=SIZES.map(s=>`<button type="button" class="pill ${st.size===s[0]?'on':''}" data-v="${s[0]}">${s[0]}</button>`).join('');
 $('sizes').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.size=st.size===b.dataset.v?'':b.dataset.v;st.shown=20;render()});
 const cnt={};base().forEach(p=>{const k=shortInd(p.industry);cnt[k]=(cnt[k]||0)+1});
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]);if(st.ind&&!top.includes(st.ind))top.unshift(st.ind);
 $('inds').innerHTML=top.map(k=>`<button type="button" class="pill ${st.ind===k?'on':''}" data-v="${esc(k)}" title="${esc(k)}">${esc(k)}</button>`).join('');
 $('inds').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.ind=st.ind===b.dataset.v?'':b.dataset.v;st.shown=20;render()});
}
const map=L.map('map',{zoomControl:false,attributionControl:false,scrollWheelZoom:false}).fitBounds([[36.76,126.97],[37.02,127.18]]);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,className:'mute'}).addTo(map);
let layer=L.layerGroup().addTo(map);
function renderMap(list){layer.clearLayers();const all=rows.filter(p=>inSize(p)&&(!st.ind||shortInd(p.industry)===st.ind));
 const max=Math.max(1,...CITIES.map(c=>all.filter(p=>p.city===c).length));
 CITIES.forEach(c=>{const n=all.filter(p=>p.city===c).length;if(!n)return;const on=!st.cities.size||st.cities.has(c);const sz=Math.round(40+30*Math.sqrt(n/max));
  const m=L.marker(CENTER[c],{icon:L.divIcon({className:'',html:`<div class="bub ${on?'':'off'}" style="width:${sz}px;height:${sz}px">${c.slice(0,2)}<span>${n}</span></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]})}).addTo(layer);
  m.on('click',()=>{st.cities.has(c)?st.cities.delete(c):st.cities.add(c);st.shown=20;render()})});
 const cs=st.cities.size?[...st.cities]:CITIES;$('cmp').href='#';$('cmp').title='동네 비교 페이지 준비 중 ('+cs.join('·')+')';}
function render(){
 renderSide();const list=filtered();const inds=new Set(list.map(p=>p.industry));
 $('title').textContent=`${job} 관련 업체 ${list.length.toLocaleString()} 곳`;
 $('desc').innerHTML=`${esc(job)} → ${esc(cat)} ${inds.size} 개 업종의 국민연금 가입 사업장에서 찾았어요 · <button type="button" id="bb">기준 보기</button>`;
 $('basis').innerHTML=`‘${esc(job)}’ 직종은 업종 분류 <b>${esc(cat)}</b>에 연결했어요. 업체 데이터는 직종이 아닌 업종 기준이라, 이 업종에 속한 국민연금 가입 사업장(천안·아산·평택, 골프장 제외)을 보여드립니다. 채용 여부는 데이터에 없어 ‘채용공고’는 외부 검색으로 연결됩니다.`;
 $('bb').onclick=()=>$('basis').classList.toggle('on');
 const show=list.slice(0,st.shown);if(!st.sel||!show.some(p=>p.pid===st.sel))st.sel=show[0]?.pid;
 $('list').innerHTML=show.length?show.map(p=>{const n=cleanName(p.name);return `<div class="co ${p.pid===st.sel?'sel':''}" data-pid="${p.pid}"><i class="lt">${esc(n[0]||'?')}</i><span><b>${esc(n)}</b><small>${esc(p.city.slice(0,2))} ${esc(dong(p))} · ${esc(shortInd(p.industry))} · 가입자 ${p.headcount!=null?p.headcount.toLocaleString():'-'} 명</small></span><a class="hire" target="_blank" rel="noopener" href="https://www.saramin.co.kr/zf_user/search?searchword=${encodeURIComponent(n)}">채용공고 ↗</a></div>`}).join('')+(list.length>st.shown?`<button class="more" id="more" type="button">업체 더 보기 (${(list.length-st.shown).toLocaleString()} 곳 남음)</button>`:''):'<div class="empty">조건에 맞는 업체가 없어요. 필터를 줄여 보세요.</div>';
 $('list').querySelectorAll('.co').forEach(el=>el.onclick=e=>{if(e.target.closest('a'))return;const p=rows.find(r=>r.pid===el.dataset.pid);if(p&&p.lat)location.href='/ilteodongne-web/place/?'+new URLSearchParams({pid:p.pid,lat:p.lat,lng:p.lng,city:p.city,address:p.address||''})});
 if($('more'))$('more').onclick=()=>{st.shown+=20;render()};
 renderMap(list);
 const u=new URL(location.href);u.searchParams.set('job',job);st.cities.size?u.searchParams.set('region',[...st.cities].join(',')):u.searchParams.delete('region');history.replaceState(null,'',u);
}
fetchAll().then(d=>{rows=d.filter(p=>!/골프/.test((p.name||'')+(p.industry||''))&&p.lat>36.6&&p.lat<37.2);rows.sort((a,b)=>(b.headcount||0)-(a.headcount||0));render()}).catch(()=>{$('title').textContent='업체를 불러오지 못했어요';});
</script></body></html>
