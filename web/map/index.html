<style>

.mapw{position:relative}#map{position:absolute;inset:0;z-index:0}

.layers button{border:0;background:none;font:inherit;font-size:14px;color:#555;height:52px;cursor:pointer;border-bottom:1px solid #f0f0f0}.layers button:last-child{border:0}
.layers button.on{color:var(--o);font-weight:800}

.pin.on{background:var(--o);color:#fff}

#dp{position:absolute;left:0;top:0;bottom:0;width:340px;z-index:700;background:#fff;box-shadow:2px 0 10px rgba(0,0,0,.15);overflow:auto;overscroll-behavior:contain;padding:16px 18px 20px;display:none}
#dp.on{display:block}#dp h3{margin:0;font-size:18px;font-weight:800;padding-right:36px}#dp .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;background:#f2f2f2;border-radius:50%;font-size:18px;cursor:pointer}
#dp .tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--o);border:1px solid var(--o);background:var(--ol);border-radius:12px;padding:2px 10px}
#dp h4{margin:16px 0 8px;font-size:14px;font-weight:800}#dp table{width:100%;border-collapse:collapse;font-size:13px}#dp th{text-align:left;color:#777;font-weight:500;border-bottom:1px solid #eee;padding:6px 4px}#dp td{padding:7px 4px;border-bottom:1px solid #f2f2f2}
#dp .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}#dp .kv div{background:#f6f6f6;border-radius:6px;padding:8px 10px;font-size:12px;color:#666}#dp .kv b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
#dp .out{display:flex;flex-direction:column;gap:8px;margin-top:8px}#dp .out a{color:var(--o);font-weight:800;font-size:14px}
#dp .nt{font-size:11px;color:#888;line-height:1.5;margin-top:12px}
.pp b{font-size:13px}.pp small{display:block;color:#666;font-size:12px;margin-top:2px}.pp .ng{color:#3f9a5c;font-weight:700}
@media (max-width:640px){
header{height:auto;flex-wrap:wrap;padding:10px 16px 0;position:sticky;top:0;z-index:1000}
.logo{width:auto;font-size:20px}.app{height:34px;padding:0 16px;font-size:13px}
nav{order:3;width:100%;height:44px;overflow-x:auto;scrollbar-width:none;margin-top:6px}nav::-webkit-scrollbar{display:none}
nav a{margin-right:22px;font-size:15px;white-space:nowrap;flex:none}
.bar{overflow-x:auto;padding:10px 16px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar select,.bar button{flex:none;height:40px;min-width:0}
.body{display:flex;flex-direction:column;height:auto;min-height:0}
.mapw{order:1;height:58vh;min-height:340px}.side{order:2;padding:14px 16px 24px;overflow:visible}
.layers{width:52px;right:10px;top:10px}.layers button{height:44px;font-size:13px}
.info{left:10px;right:10px;bottom:10px;width:auto;padding:10px 14px}.info p{font-size:13px;margin-top:6px}
.bar{flex-wrap:nowrap}.bar .hint{display:none}
.mapw{overflow:hidden}
.layers{z-index:520}
.info{z-index:510;max-width:calc(100% - 72px)}
#dp{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;max-height:min(62vh,calc(100dvh - 140px));border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.2);z-index:2000;padding:22px 16px 24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#dp::before{content:'';position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#ddd}
body.map-sheet-open{overflow:hidden;width:100%}
body.map-sheet-open .info,body.map-sheet-open .layers{visibility:hidden;pointer-events:none}
}

</style></head><body>
<header><a class="logo" href="/ilteodongne-web/">일터<b>동네</b></a><nav><a id="nj" href="/ilteodongne-web/jobs/">직장 찾기</a><a id="nc" href="/ilteodongne-web/compare/">동네 비교</a><a class="on" href="/ilteodongne-web/map/">집·인프라</a><a href="/ilteodongne-web/blog/">동네 이야기</a></nav><a class="app" href="#" aria-disabled="true">앱 다운로드</a></header>
<div class="bar">

<select id="city" aria-label="지역"><option value="">전체 지역</option><option>평택시</option><option>천안시</option><option>아산시</option></select>
<select id="sort" aria-label="정렬"><option value="n">업체 많은순</option><option value="rent">월세 낮은순</option><option value="infra">인프라 많은순</option></select>

</div>
<div class="body">
<aside class="side"><div class="sh"><b id="cnt">불러오는 중…</b><span class="ex">실거래 시세</span></div><div id="list"></div>
<p class="note">동네(읍·면·동) 단위로 묶은 국민연금 사업장·국토부 실거래 요약입니다. 채용·매물은 사람인·네이버 검색 링크만 제공합니다.</p></aside>
<div class="mapw"><div id="map"></div>
<div id="dp" role="dialog" aria-label="동네 상세"></div>
<div class="layers" id="layers"><button data-l="hood" class="on">동네</button><button data-l="clinic" class="on">병원</button><button data-l="convenience" class="on">마트</button><button data-l="bus">교통</button></div>
<div class="info"><div class="t">선택한 동네 인프라<span class="ex">실데이터</span></div><p id="infra">동네를 선택해 주세요</p></div>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const U='https://zurfdfqfztydhbmjwyqx.supabase.co',K='sb_publishable_8asTfEEJyyDniSAITehVqg_fNAf1Oh7',B='/ilteodongne-web/';
const CATS=['제조/생산','건설/공사','물류/운송','의료/요양/복지','IT/연구/기술','도소매/유통','시설관리/환경','사무/전문서비스','음식/숙박','교육','기타'];
const JOBMAP=[[/생산|품질|설비|조립|용접|가공|도장|검사|오퍼|기계/,'제조/생산'],[/물류|지게차|운송|배송|택배|운전|창고/,'물류/운송'],[/사무|경리|회계|총무|인사/,'사무/전문서비스'],[/건설|공사|현장/,'건설/공사'],[/요양|간호|의료|복지/,'의료/요양/복지'],[/개발|연구|IT/,'IT/연구/기술']];
const qs=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const job=(qs.get('job')||'생산직').trim();
$('nj').href=B+'jobs/?'+new URLSearchParams({job});$('nc').href=B+'compare/?'+new URLSearchParams({job});
const cat=((JOBMAP.find(([r])=>r.test(job))||[0,'제조/생산'])[1]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cleanName=s=>String(s||'').replace(/주식회사|\(주\)|㈜|\(유\)|유한회사/g,'').trim();
const km=(a,b,c,d)=>{const r=Math.PI/180;return 6371*Math.hypot((d-b)*r*Math.cos((a+c)/2*r),(c-a)*r)};
function loc(p){const a=String(p.address||'').split(/\s+/);const i=a.indexOf(p.city);if(i<0)return null;let city=p.city,k=i+1;if(/구$/.test(a[k]||'')){city=p.city+' '+a[k];k++}const d=a[k]||'';return /[읍면동]$/.test(d)?{city,umd:d}:null}
const R=2.0,KIND={clinic:'병원·의원',convenience:'편의점',bus:'버스정류장',pharmacy:'약국'};
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([36.85,127.1],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,className:'mute'}).addTo(map);
const LY={hood:L.layerGroup(),clinic:L.layerGroup(),convenience:L.layerGroup(),bus:L.layerGroup()};
let rent=[],infra={},pts=new Map(),hoods=[],sel=null;
async function fetchCat(c,out,seen){for(let off=0;off<5000;off+=1000){const r=await fetch(`${U}/rest/v1/rpc/search_places?offset=${off}&limit=1000`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_category:c,p_city:null,p_limit:5000})});const d=await r.json();if(!Array.isArray(d)||!d.length)break;let n=0;for(const p of d){if(!p||seen.has(p.pid))continue;seen.add(p.pid);out.push(p);n++}if(!n||d.length<1000)break}}
function pop(k,q){const o=q[3]||{};return `<div class="pp"><b>${esc(q[2]||KIND[k])}</b><small>${esc(o.t||KIND[k])}</small>${o.night?'<small class="ng">야간 진료</small>':''}${o.sat?'<small>토요일 진료</small>':''}</div>`}
function avgRent(city,umd,band){const rr=rent.filter(x=>x.city===city&&x.umd.split(' ')[0]===umd&&x.band.startsWith(band));const n=rr.reduce((s,x)=>s+x.n,0);return n?{n,dep:Math.round(rr.reduce((s,x)=>s+x.dep*x.n,0)/n),rent:Math.round(rr.reduce((s,x)=>s+x.rent*x.n,0)/n),rows:rr}:null}
function cnt(arr,la,ln,ok=()=>true){return arr.filter(q=>ok(q)&&km(la,ln,q[0],q[1])<=R).length}
function buildHoods(cos){
 const g=new Map();cos.forEach(p=>{const l=loc(p);if(!l)return;const k=l.city+'|'+l.umd;if(!g.has(k))g.set(k,{...l,list:[]});g.get(k).list.push(p)});
 hoods=[...g.values()].filter(d=>pts.has(d.city+'|'+d.umd)).map(d=>{
  const [la,ln]=pts.get(d.city+'|'+d.umd);d.list.sort((a,b)=>(b.headcount||0)-(a.headcount||0));
  const fac={clinic:cnt(infra.clinic,la,ln),bus:cnt(infra.bus,la,ln),convenience:cnt(infra.convenience,la,ln),pharmacy:cnt(infra.pharmacy,la,ln),night:cnt(infra.clinic,la,ln,q=>q[3]&&q[3].night)};
  return{key:d.city+'|'+d.umd,city:d.city,umd:d.umd,name:d.city.replace(/시( |$)/,' ').split(' ')[0]+' '+d.umd,n:d.list.length,la,ln,list:d.list,fac};
 });
}
function filtered(){
 const city=$('city').value,band=$('band').value,sort=$('sort').value;
 let list=hoods.filter(h=>!city||h.city.startsWith(city)).map(h=>({...h,rv:avgRent(h.city,h.umd,band)}));
 list=list.filter(h=>h.rv||h.n); // keep even without rent if has companies
 list.sort(sort==='rent'?(a,b)=>(a.rv?.rent??999)-(b.rv?.rent??999):sort==='infra'?(a,b)=>(b.fac.clinic+b.fac.bus+b.fac.convenience)-(a.fac.clinic+a.fac.bus+a.fac.convenience):(a,b)=>b.n-a.n);
 return list;
}
const mob=()=>matchMedia('(max-width:640px)').matches;let _sy=0;
function lockScroll(){if(!mob())return;_sy=window.scrollY||0;document.body.classList.add('map-sheet-open');document.body.style.top=`-${_sy}px`;document.body.style.position='fixed';document.body.style.left='0';document.body.style.right='0'}
function unlockScroll(){if(!document.body.classList.contains('map-sheet-open'))return;document.body.classList.remove('map-sheet-open');document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';window.scrollTo(0,_sy)}
function pick(key){sel=key;build();const h=filtered().find(x=>x.key===key);if(!h)return;map.setView([h.la,h.ln],13,{animate:false});detail(h);const c=document.querySelector(`.card[data-k="${CSS.escape(key)}"]`);c&&c.scrollIntoView({block:'nearest'});setTimeout(()=>map.invalidateSize(),50)}
function detail(h){
 const rows=rent.filter(r=>r.city===h.city&&r.umd.split(' ')[0]===h.umd);
 const sample=h.list.slice(0,6).map(p=>esc(cleanName(p.name))).join('<br>');
 const q=encodeURIComponent(`${job} ${h.name}`),land=encodeURIComponent(`${h.city} ${h.umd} 원룸`);
 $('dp').innerHTML=`<button class="x" id="dpx" aria-label="닫기">✕</button><h3>${esc(h.name)}</h3><span class="tag">동네 단위 · 매물 아님</span>
 <h4>${esc(job)} 관련 업체 ${h.n}곳</h4><div class="kv"><div>대표 업체 (가입자 순)<b style="font-size:13px;font-weight:600;line-height:1.5;margin-top:6px">${sample||'-'}</b></div><div>반경 2km 인프라<b>병원 ${h.fac.clinic} · 약국 ${h.fac.pharmacy}</b>편의점 ${h.fac.convenience} · 버스 ${h.fac.bus}<br>야간 진료 ${h.fac.night}</div></div>
 <h4>실거래 시세 (국토부 요약)</h4><table><thead><tr><th>방 종류</th><th>거래</th><th>보증금</th><th>월세</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.band)}</td><td>${r.n}건</td><td>${r.dep.toLocaleString()}만</td><td>${r.rent}만</td></tr>`).join(''):'<tr><td colspan="4">이 동네 거래 자료 없음</td></tr>'}</tbody></table>
 <h4>외부에서 찾기</h4><div class="out"><a target="_blank" rel="noopener" href="https://www.saramin.co.kr/zf_user/search?searchword=${q}">사람인에서 ‘${esc(job)} ${esc(h.name)}’ 채용 검색 ↗</a><a target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query=${land}">네이버에서 ‘${esc(h.city)} ${esc(h.umd)} 원룸’ 매물 검색 ↗</a></div>
 <p class="nt">채용공고·매물 원문은 저장하지 않아요. 실거래는 동·리×방 종류 대표값이며 개별 거래일·면적·층은 없습니다.</p>`;
 if(mob()&&$('dp').parentElement!==document.body)document.body.appendChild($('dp'));
lockScroll();$('dp').classList.add('on');$('dp').scrollTop=0;$('dpx').onclick=closeD;setTimeout(()=>map.invalidateSize(),50);
 $('infra').textContent=`${h.name}: 병원·의원 ${h.fac.clinic}(야간 ${h.fac.night}) · 약국 ${h.fac.pharmacy} · 편의점 ${h.fac.convenience} · 버스 ${h.fac.bus}`;
}
function closeD(){$('dp').classList.remove('on');unlockScroll();setTimeout(()=>map.invalidateSize(),50)}
function build(){
 const list=filtered();if(!list.some(h=>h.key===sel))sel=list[0]?.key||null;
 $('cnt').textContent=`${job} 관련 동네 ${list.length} 곳`;$('hint').textContent=`${job} · 동네 단위 · 매물 아님`;
 $('list').innerHTML=list.length?list.map(h=>`<div class="card ${h.key===sel?'sel':''}" data-k="${esc(h.key)}"><b>${esc(h.name)}</b><small>관련 업체 <span class="c">${h.n}곳</span> · ${h.rv?`월세 평균 ${h.rv.rent}만 (${h.rv.n}건)`:'월세 자료 없음'}</small><div class="fac">병원 ${h.fac.clinic} · 편의점 ${h.fac.convenience} · 버스 ${h.fac.bus}</div></div>`).join(''):'<p class="note">조건에 맞는 동네가 없어요.</p>';
 $('list').querySelectorAll('.card').forEach(c=>c.onclick=()=>pick(c.dataset.k));
 LY.hood.clearLayers();list.forEach(h=>{const label=h.rv?String(h.rv.rent):String(h.n);L.marker([h.la,h.ln],{icon:L.divIcon({className:'',html:`<span class="pin ${h.key===sel?'on':''}">${label}</span>`,iconSize:[0,0]}),zIndexOffset:h.key===sel?900:0}).on('click',()=>pick(h.key)).bindTooltip(esc(h.name)).addTo(LY.hood)});
 const focus=list.find(h=>h.key===sel)||list[0];
 for(const k of ['clinic','convenience','bus']){LY[k].clearLayers();if(!focus)continue;infra[k].filter(q=>km(focus.la,focus.ln,q[0],q[1])<=R).slice(0,300).forEach(q=>L.marker([q[0],q[1]],{icon:L.divIcon({className:'',html:`<div class="dot" style="background:${k==='clinic'?'#3f9a5c':k==='convenience'?'#3f7fd8':'#8a6bd1'}">${k==='clinic'?'병':k==='convenience'?'마':'버'}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).bindPopup(()=>pop(k,q)).addTo(LY[k]))}
 if(list.length){const b=L.latLngBounds(list.map(h=>[h.la,h.ln]));map.fitBounds(b.pad(0.2),{animate:false,maxZoom:12})}
 const u=new URL(location.href);u.searchParams.set('job',job);if(sel){const h=list.find(x=>x.key===sel);if(h){u.searchParams.set('city',h.city);u.searchParams.set('umd',h.umd);u.searchParams.set('lat',h.la);u.searchParams.set('lng',h.ln)}}history.replaceState(null,'',u);
}

 else if(qs.get('lat')&&qs.get('lng')){const la=+qs.get('lat'),ln=+qs.get('lng');let best=null,bd=1e9;hoods.forEach(h=>{const d=km(la,ln,h.la,h.ln);if(d<bd){bd=d;best=h.key}});sel=best}
 Object.entries(LY).forEach(([k,l])=>{if(document.querySelector(`[data-l=${k}]`)?.classList.contains('on'))l.addTo(map)});
 if(mob())document.body.appendChild($('dp'));

['band','city','sort'].forEach(id=>$(id).onchange=()=>{closeD();build()});
